version: 2

project_name: datasim

before:
  hooks:
    - go mod tidy

builds:
  - id: datasim
    main: ./cmd/datasim
    binary: datasim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}
        -X main.repository=cirrusdata/datasim

archives:
  - id: release-archives
    ids:
      - datasim
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

source:
  enabled: false

release:
  draft: false
  prerelease: auto
  header: |
    ## Installing

    **Linux (amd64):**
    ```bash
    curl -sL https://github.com/cirrusdata/datasim/releases/download/{{ .Tag }}/datasim_{{ .Version }}_linux_amd64.tar.gz \
      | sudo tar xz -C /usr/local/bin datasim
    ```

    **Linux (arm64):**
    ```bash
    curl -sL https://github.com/cirrusdata/datasim/releases/download/{{ .Tag }}/datasim_{{ .Version }}_linux_arm64.tar.gz \
      | sudo tar xz -C /usr/local/bin datasim
    ```

    **Windows (auto-detect amd64/arm64):**
    ```powershell
    powershell -NoProfile -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/cirrusdata/datasim/{{ .Tag }}/install-release.ps1').Content)) -Version '{{ .Tag }}'"
    ```

    This installs `datasim.exe` to `%LocalAppData%\Programs\datasim`, verifies the archive against `checksums.txt`, and adds that directory to the user `PATH`.

    Verify the install:
    ```bash
    datasim version
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
